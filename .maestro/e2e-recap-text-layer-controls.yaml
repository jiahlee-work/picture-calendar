    timeout: 5000
- tapOn:
    point: "50%,20%"
- assertNotVisible: "Bottom Sheet"
- tapOn: "텍스트 색상 선택"
- extendedWaitUntil:
    visible: "Bottom Sheet"
    timeout: 5000
- tapOn:
    point: "40%,78%"
