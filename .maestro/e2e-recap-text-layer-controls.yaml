- tapOn: "텍스트 추가"
- waitForAnimationToEnd
- tapOn: "텍스트 스타일 선택"
- extendedWaitUntil:
    visible: "굵게"
    timeout: 5000
- tapOn: "굵게"
- tapOn: "텍스트 정렬 선택"
- extendedWaitUntil:
    visible: "가운데 정렬"
    timeout: 5000
- tapOn: "가운데 정렬"
